<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WSOLA Time Stretch Demo</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      display: flex;
      justify-content: center;
      padding: 40px 20px;
      min-height: 100vh;
    }
    .container { max-width: 560px; width: 100%; }
    h1 { text-align: center; margin-bottom: 24px; font-size: 22px; color: #fff; }
    .card {
      background: #16213e;
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 16px;
    }
    /* file drop */
    .file-drop {
      border: 2px dashed #4a4a6a;
      border-radius: 8px;
      padding: 36px 16px;
      text-align: center;
      cursor: pointer;
      transition: border-color .2s;
    }
    .file-drop:hover, .file-drop.over { border-color: #6c63ff; }
    .file-drop input { display: none; }
    .file-info { margin-top: 10px; font-size: 13px; color: #888; }
    /* slider */
    .slider-group { margin-bottom: 20px; }
    .slider-label {
      display: flex; justify-content: space-between;
      margin-bottom: 6px; font-size: 14px;
    }
    .slider-value { color: #6c63ff; font-weight: 600; }
    input[type=range] { width: 100%; accent-color: #6c63ff; }
    /* buttons */
    .controls { display: flex; gap: 10px; justify-content: center; }
    button {
      background: #6c63ff; border: none; color: #fff;
      padding: 9px 22px; border-radius: 8px; font-size: 15px;
      cursor: pointer; transition: background .15s;
    }
    button:hover:not(:disabled) { background: #5a52d5; }
    button:disabled { background: #3a3a5a; color: #666; cursor: default; }
    button.stop { background: #e74c3c; }
    button.stop:hover:not(:disabled) { background: #c0392b; }
    /* progress */
    .progress-bar {
      width: 100%; height: 6px; background: #2a2a4a;
      border-radius: 3px; overflow: hidden; margin-top: 18px;
      cursor: pointer;
    }
    .progress-fill {
      height: 100%; background: #6c63ff; width: 0%;
      transition: width .08s linear;
    }
    .time { text-align: center; margin-top: 6px; font-size: 13px; color: #888; }
    .status { text-align: center; margin-top: 10px; font-size: 12px; color: #555; }
  </style>
</head>
<body>
<div class="container">
  <h1>WSOLA Time Stretch</h1>

  <div class="card">
    <div class="file-drop" id="drop">
      <div>Drop an audio file here or click to browse</div>
      <input type="file" id="file" accept="audio/*">
      <div class="file-info" id="info"></div>
    </div>
  </div>

  <div class="card">
    <div class="slider-group">
      <div class="slider-label">
        <span>Speed</span>
        <span class="slider-value" id="ratioVal">1.0x</span>
      </div>
      <input type="range" id="ratio" min="0.5" max="2.0" step="0.1" value="1.0">
    </div>

    <div class="controls">
      <button id="playBtn" disabled>Play</button>
      <button id="pauseBtn" disabled>Pause</button>
      <button id="stopBtn" class="stop" disabled>Stop</button>
    </div>

    <div class="progress-bar" id="bar">
      <div class="progress-fill" id="fill"></div>
    </div>
    <div class="time" id="time">0:00 / 0:00</div>
    <div class="status" id="status"></div>
  </div>
</div>

<script>
  // ── state ──────────────────────────────────────────────────
  let ctx = null, node = null, playing = false;
  let totalSamples = 0, curPos = 0, sr = 48000;

  // ── DOM ────────────────────────────────────────────────────
  const $ = (id) => document.getElementById(id);
  const drop     = $('drop'),   fileIn  = $('file');
  const info     = $('info'),   status  = $('status');
  const ratioIn  = $('ratio'),  ratioVal = $('ratioVal');
  const playBtn  = $('playBtn'), pauseBtn = $('pauseBtn'), stopBtn = $('stopBtn');
  const bar      = $('bar'),    fill    = $('fill'),   timeEl = $('time');

  // ── helpers ────────────────────────────────────────────────
  const fmt = (s) => {
    const m = Math.floor(s / 60);
    return m + ':' + String(Math.floor(s % 60)).padStart(2, '0');
  };
  function updateUI() {
    const pct = totalSamples ? curPos / totalSamples * 100 : 0;
    fill.style.width = Math.min(pct, 100) + '%';
    timeEl.textContent = fmt(curPos / sr) + ' / ' + fmt(totalSamples / sr);
    playBtn.disabled  = !totalSamples || playing;
    pauseBtn.disabled = !playing;
    stopBtn.disabled  = !totalSamples;
  }

  // ── file input ─────────────────────────────────────────────
  drop.addEventListener('click', () => fileIn.click());
  drop.addEventListener('dragover', (e) => { e.preventDefault(); drop.classList.add('over'); });
  drop.addEventListener('dragleave', () => drop.classList.remove('over'));
  drop.addEventListener('drop', (e) => { e.preventDefault(); drop.classList.remove('over'); if (e.dataTransfer.files.length) load(e.dataTransfer.files[0]); });
  fileIn.addEventListener('change', () => { if (fileIn.files.length) load(fileIn.files[0]); });

  // ── transport ──────────────────────────────────────────────
  playBtn.addEventListener('click', () => { send('play'); ctx.resume(); playing = true; updateUI(); });
  pauseBtn.addEventListener('click', () => { send('pause'); playing = false; updateUI(); });
  stopBtn.addEventListener('click', () => { send('stop'); playing = false; curPos = 0; updateUI(); });

  ratioIn.addEventListener('input', () => {
    const v = parseFloat(ratioIn.value);
    ratioVal.textContent = v.toFixed(1) + 'x';
    send('ratio', { value: v });
  });

  bar.addEventListener('click', (e) => {
    if (!totalSamples) return;
    const pct = (e.clientX - bar.getBoundingClientRect().left) / bar.offsetWidth;
    curPos = Math.floor(pct * totalSamples);
    send('seek', { position: curPos });
    updateUI();
  });

  // ── worklet communication ──────────────────────────────────
  function send(type, extra) {
    if (node) node.port.postMessage(Object.assign({ type }, extra));
  }

  function onWorkletMsg(e) {
    const d = e.data;
    if (d.type === 'progress') { curPos = d.position; updateUI(); }
    else if (d.type === 'ended') { playing = false; curPos = 0; updateUI(); }
    else if (d.type === 'ready') { status.textContent = 'WASM ready'; }
    else if (d.type === 'error') { status.textContent = 'Error: ' + d.message; }
  }

  // ── init worklet on page load ────────────────────────────
  let initReady = null; // resolves when worklet is ready

  (async function init() {
    status.textContent = 'Loading WASM\u2026';
    try {
      ctx = new AudioContext();
      sr = ctx.sampleRate;

      await ctx.audioWorklet.addModule('../build/wsola-worklet.js');

      node = new AudioWorkletNode(ctx, 'wsola-processor', {
        numberOfInputs: 0,
        numberOfOutputs: 1,
        outputChannelCount: [2],
        processorOptions: { sampleRate: ctx.sampleRate, channels: 2 },
      });
      node.connect(ctx.destination);
      node.port.onmessage = onWorkletMsg;

      send('ratio', { value: parseFloat(ratioIn.value) });
    } catch (e) {
      status.textContent = 'Init failed: ' + e.message;
    }
  })();

  // ── load file ──────────────────────────────────────────────
  async function load(file) {
    if (!node) { info.textContent = 'Worklet not ready yet'; return; }
    info.textContent = 'Loading\u2026';
    try {
      const buf = await ctx.decodeAudioData(await file.arrayBuffer());

      totalSamples = buf.length;
      curPos = 0;

      if (playing) { send('stop'); playing = false; }

      // Always send stereo (duplicate mono if needed)
      const ch0 = new Float32Array(buf.getChannelData(0));
      const ch1 = buf.numberOfChannels > 1
        ? new Float32Array(buf.getChannelData(1))
        : new Float32Array(ch0);

      node.port.postMessage({ type: 'audio', channelData: [ch0, ch1], channels: 2 });

      info.textContent =
        file.name + '  (' + fmt(buf.length / sr) + ', ' +
        buf.numberOfChannels + 'ch, ' + sr + ' Hz)';
      updateUI();
    } catch (e) {
      info.textContent = 'Error: ' + e.message;
    }
  }
</script>
</body>
</html>
